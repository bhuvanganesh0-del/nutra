<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="NutriSnap - AI-powered food calorie and nutrition tracker">
<link rel="apple-touch-icon" href="">
<title>NutriSnap</title>
<style>
:root{
  --bg:#ffffff; --card:#f6f8f6; --card2:#eef2ee; --text:#16211a; --muted:#6b7a70;
  --green:#34c759; --green-soft:#e5f8ea; --green-deep:#1f9d45; --blue:#0a84ff; --orange:#ff9f0a; --red:#ff453a;
  --radius:22px; --shadow:0 4px 20px rgba(20,40,28,.07);
  --nav-h:84px;
}
[data-theme="dark"]{
  --bg:#0c120e; --card:#161e19; --card2:#1e2822; --text:#eef5f0; --muted:#8fa398;
  --green:#30d158; --green-soft:#14301e; --green-deep:#34c759; --blue:#409cff; --orange:#ffd60a; --red:#ff6961;
  --shadow:0 4px 24px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  transition:background .3s,color .3s;max-width:560px;margin:0 auto}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.small{font-size:13px;color:var(--muted)}
.page{padding:18px 18px 24px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);animation:pop .35s ease}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ring{position:relative;width:150px;height:150px;margin:6px auto}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:30px;font-weight:800;letter-spacing:-1px}
.macro{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;background:var(--card2);border-radius:16px}
.macro b{font-size:16px}
.macro span{font-size:11px;color:var(--muted)}
.pbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.pbar>div{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--green-soft);color:var(--green-deep)}
.meal-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--card2)}
.meal-item:last-child{border-bottom:none}
.meal-img{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--card2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:16px;font-weight:700;font-size:16px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn-green{background:var(--green);color:#fff;width:100%;box-shadow:0 6px 18px rgba(52,199,89,.35)}
.btn-soft{background:var(--card2);color:var(--text);width:100%}
.btn-danger{background:rgba(255,69,58,.12);color:var(--red);width:100%}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:17px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--card2);background:var(--card2);color:var(--text);outline:none;transition:border .2s}
.field input:focus,.field select:focus{border-color:var(--green)}
input[type=range]{width:100%;accent-color:var(--green)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
  background:var(--bg);border-top:1px solid var(--card2);display:flex;justify-content:space-around;
  padding:10px 8px calc(12px + env(safe-area-inset-bottom));z-index:50;transition:background .3s}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted);width:60px;padding-top:4px}
.navbtn.on{color:var(--green)}
.navbtn .nico{font-size:21px}
.scanfab{width:60px;height:60px;border-radius:50%;background:var(--green);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;margin-top:-32px;box-shadow:0 8px 24px rgba(52,199,89,.45);border:5px solid var(--bg);transition:transform .15s}
.scanfab:active{transform:scale(.92)}
.chip{display:inline-flex;padding:8px 14px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:600;margin:0 6px 8px 0}
.chip.on{background:var(--green);color:#fff}
.chatwrap{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:82%;padding:12px 15px;border-radius:20px;font-size:15px;line-height:1.45;animation:pop .25s ease;white-space:pre-line}
.bubble.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.chatbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);padding:10px 0}
.chatbar input{flex:1;padding:13px 16px;border-radius:99px;border:1.5px solid var(--card2);background:var(--card2);color:var(--text);outline:none}
.sendbtn{width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;font-size:18px;flex-shrink:0}
.skel{border-radius:14px;background:linear-gradient(90deg,var(--card2) 25%,var(--card) 50%,var(--card2) 75%);background-size:800px 100%;animation:shimmer 1.3s infinite}
.hidden{display:none!important}
.switch{position:relative;width:52px;height:32px;background:var(--card2);border-radius:99px;transition:.3s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.3s}
.switch.on{background:var(--green)}
.switch.on::after{left:23px}
.watercup{font-size:34px;filter:grayscale(1) opacity(.3);transition:.3s}
.watercup.full{filter:none}
canvas.chart{width:100%;height:180px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.hdr .date{font-size:13px;color:var(--muted);font-weight:600}
.notice{background:var(--green-soft);border:1px solid rgba(52,199,89,.25);color:var(--green-deep);padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5;margin-bottom:14px}
.est-tag{font-size:11px;font-weight:700;color:var(--orange);background:rgba(255,159,10,.12);padding:2px 8px;border-radius:99px}
textarea{width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--card2);background:var(--card2);color:var(--text);min-height:70px;outline:none;resize:vertical}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
/* ============================================================
   NutriSnap — AI Food Calorie & Nutrition Tracker (PWA)
   ============================================================ */
"use strict";

/* ---------- FOOD DATABASE (USDA-based typical values, per 100 g) ---------- */
/* [name, kcal, protein g, carbs g, fat g, fiber g, category] */
const FOODS = [
["Chicken breast (cooked)",165,31.0,0,3.6,0,"Protein"],["Chicken thigh (cooked)",209,26.0,0,11.0,0,"Protein"],
["Lean beef (cooked)",250,26.0,0,15.0,0,"Protein"],["Salmon (cooked)",208,20.0,0,13.0,0,"Protein"],
["Tuna (canned in water)",116,26.0,0,1.0,0,"Protein"],["Egg (whole)",155,13.0,1.1,11.0,0,"Protein"],
["Egg white",52,11.0,0.7,0.2,0,"Protein"],["Greek yogurt (plain)",97,9.0,3.6,5.0,0,"Dairy"],
["Cottage cheese",98,11.0,3.4,4.3,0,"Dairy"],["Milk (2%)",50,3.3,4.8,2.0,0,"Dairy"],
["Whey protein powder",400,80.0,8.0,6.0,0,"Protein"],["Tofu (firm)",144,15.0,2.8,8.7,2.3,"Protein"],
["Lentils (cooked)",116,9.0,20.0,0.4,7.9,"Legumes"],["Chickpeas (cooked)",164,8.9,27.0,2.6,7.6,"Legumes"],
["Black beans (cooked)",132,8.9,23.7,0.5,8.7,"Legumes"],["Rice (white, cooked)",130,2.7,28.0,0.3,0.4,"Grains"],
["Rice (brown, cooked)",112,2.6,24.0,0.9,1.8,"Grains"],["Quinoa (cooked)",120,4.4,21.3,1.9,2.8,"Grains"],
["Oats (dry)",379,13.0,67.0,6.9,10.0,"Grains"],["Whole wheat bread",247,13.0,41.0,3.4,7.0,"Grains"],
["Pasta (cooked)",158,5.8,31.0,0.9,1.8,"Grains"],["Sweet potato",86,1.6,20.0,0.1,3.0,"Vegetables"],
["Potato (boiled)",87,1.9,20.0,0.1,1.8,"Vegetables"],["Broccoli",34,2.8,6.6,0.4,2.6,"Vegetables"],
["Spinach (raw)",23,2.9,3.6,0.4,2.2,"Vegetables"],["Kale",49,4.3,8.8,0.9,4.1,"Vegetables"],
["Carrot",41,0.9,9.6,0.2,2.8,"Vegetables"],["Tomato",18,0.9,3.9,0.2,1.2,"Vegetables"],
["Cucumber",15,0.7,3.6,0.1,0.5,"Vegetables"],["Bell pepper",31,1.0,6.0,0.3,2.1,"Vegetables"],
["Apple",52,0.3,14.0,0.2,2.4,"Fruits"],["Banana",89,1.1,23.0,0.3,2.6,"Fruits"],
["Orange",47,0.9,12.0,0.1,2.4,"Fruits"],["Mixed berries",50,0.9,12.0,0.3,3.0,"Fruits"],
["Mango",60,0.8,15.0,0.4,1.6,"Fruits"],["Avocado",160,2.0,8.6,14.7,6.7,"Fruits"],
["Almonds",579,21.0,21.6,49.9,12.5,"Nuts"],["Peanut butter",588,25.0,20.0,50.0,6.0,"Nuts"],
["Walnuts",654,15.0,14.0,65.0,6.7,"Nuts"],["Chia seeds",486,17.0,42.0,31.0,34.0,"Nuts"],
["Olive oil",884,0,0,100,0,"Fats"],["Butter",717,0.9,0.1,81.0,0,"Fats"],
["Cheddar cheese",402,25.0,1.3,33.0,0,"Dairy"],["Mozzarella",280,28.0,2.2,17.0,0,"Dairy"],
["Paneer",265,18.0,3.6,21.0,0,"Dairy"],["Pizza (slice)",266,11.0,33.0,9.8,2.3,"Fast food"],
["Cheeseburger",263,13.0,21.0,13.0,1.5,"Fast food"],["French fries",312,3.4,41.0,15.0,3.8,"Fast food"],
["White bread",265,9.0,49.0,3.2,2.7,"Grains"],["Croissant",406,8.2,45.8,21.0,2.6,"Bakery"],
["Dal (lentil curry)",110,6.0,15.0,3.0,4.0,"Indian"],["Idli",128,3.9,27.0,0.3,3.0,"Indian"],
["Dosa",168,3.9,29.0,4.0,1.5,"Indian"],["Roti (whole wheat)",264,9.6,46.0,5.0,7.0,"Indian"],
["Curd (plain yogurt)",61,3.5,4.7,3.3,0,"Indian"],["Palak paneer",133,6.4,8.8,8.9,3.5,"Indian"],
["Chole (chickpea curry)",180,9.0,24.0,6.0,8.0,"Indian"],["Chicken biryani",180,10.0,24.0,6.0,1.5,"Indian"],
["Naan",310,9.0,54.0,7.5,2.0,"Indian"],["Sushi roll (avg)",140,4.5,28.0,1.0,1.0,"Japanese"],
["Caesar salad",190,5.0,7.0,17.0,2.0,"Salads"],["Grilled cheese sandwich",291,11.0,28.0,16.0,1.6,"Fast food"],
["Pancakes",227,6.4,28.0,9.6,1.5,"Bakery"],["Cornflakes",357,7.5,84.0,0.4,3.3,"Grains"],
["Granola",471,10.0,64.0,20.0,7.0,"Grains"],["Protein bar",350,25.0,40.0,12.0,10.0,"Snacks"],
["Hummus",166,7.9,14.0,9.6,6.0,"Dips"],["Dark chocolate",546,4.9,61.0,31.0,7.0,"Snacks"],
["Vanilla ice cream",207,3.5,24.0,11.0,0.7,"Desserts"],["Orange juice",45,0.7,10.0,0.2,0.2,"Drinks"],
["Cola",42,0,10.6,0,0,"Drinks"],["Latte",42,3.3,4.9,1.6,0,"Drinks"],
["Black coffee",1,0.1,0,0,0,"Drinks"],["Fruit smoothie",60,1.5,13.0,0.5,1.5,"Drinks"],
["Popcorn (air-popped)",387,13.0,78.0,4.5,15.0,"Snacks"]
];
const F = Object.fromEntries(FOODS.map(f=>[f[0],{kcal:f[1],p:f[2],c:f[3],f:f[4],fib:f[5],cat:f[6]}]));

/* ---------- STATE ---------- */
const LS_KEY = "nutrisnap_db_v1";
let db = load();
let state = {tab:"home", theme: db.settings.theme||"light", draft:null, diaryFilter:"daily", compareA:null, compareB:null, chat:[], chatBusy:false, analysisBusy:false};

function load(){
  try{ const d = JSON.parse(localStorage.getItem(LS_KEY)); if(d && d.meals) return d; }catch(e){}
  return { meals:[], water:{}, profile:{age:28,height:175,activity:"moderate",pref:"nonveg",goal:"maintain",calGoal:2200,proteinGoal:120,waterGoal:8},
           settings:{geminiKey:"", theme:"light"} };
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }catch(e){ toast("Storage full — old meal images may need deleting."); } }

const $ = s=>document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function todayStr(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function nowTime(){ const d=new Date(); let h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0"); const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+m+" "+ap; }
function mealSlot(dateStr,timeStr){
  const h = parseInt((timeStr||nowTime()).split(":")[0]) + ((timeStr||"").includes("PM")?12:0);
  if(h<11) return "Breakfast"; if(h<15) return "Lunch"; if(h<18) return "Snacks"; return "Dinner";
}
function toast(msg){ const t=document.createElement("div"); t.textContent=msg;
  t.style.cssText="position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:99;animation:pop .3s ease;max-width:88%;text-align:center";
  document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }

/* ---------- NUTRITION MATH ---------- */
function itemNutrients(name, grams){ const f=F[name]; if(!f) return null;
  const k=grams/100; return {name, grams:Math.round(grams), kcal:Math.round(f.kcal*k), p:+(f.p*k).toFixed(1), c:+(f.c*k).toFixed(1), f:+(f.f*k).toFixed(1), fib:+(f.fib*k).toFixed(1)}; }
function mealTotals(items){ const t={kcal:0,p:0,c:0,f:0,fib:0}; items.forEach(i=>{t.kcal+=i.kcal;t.p+=+i.p;t.c+=+i.c;t.f+=+i.f;t.fib+=+i.fib;});
  t.p=+t.p.toFixed(1);t.c=+t.c.toFixed(1);t.f=+t.f.toFixed(1);t.fib=+t.fib.toFixed(1); return t; }
function mealsOn(dateStr){ return db.meals.filter(m=>m.date===dateStr); }
function dayTotals(dateStr){ return mealTotals(mealsOn(dateStr).flatMap(m=>m.items)); }
function weekDates(){ const out=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(todayStr(d)); } return out; }
function suggestCalories(){ const p=db.profile; if(p.calGoal) return p.calGoal; return 2000; }

/* ---------- RENDER SHELL ---------- */
const TABS=[["home","Home","⌂"],["scan","Scan","◎"],["diary","Diary","▤"],["insights","Insights","◔"],["profile","Profile","◉"]];
function render(){
  document.documentElement.setAttribute("data-theme", state.theme);
  const app=$("#app");
  if(state.tab==="home") app.innerHTML=viewHome();
  else if(state.tab==="scan") app.innerHTML=viewScan();
  else if(state.tab==="diary") app.innerHTML=viewDiary();
  else if(state.tab==="insights") app.innerHTML=viewInsights();
  else app.innerHTML=viewProfile();
  renderNav();
  if(state.tab==="insights") drawCharts();
}
function renderNav(){
  $("#nav").innerHTML = TABS.map(([id,label,ico])=>{
    if(id==="scan") return `<button class="scanfab" onclick="go('scan')">◎</button>`;
    return `<button class="navbtn ${state.tab===id?'on':''}" onclick="go('${id}')"><span class="nico">${ico}</span>${label}</button>`;
  }).join("");
}
function go(tab){ state.tab=tab; render(); window.scrollTo(0,0); }

/* ---------- HOME ---------- */
function ringSVG(pct,color){
  const r=64, c=2*Math.PI*r, off=c*(1-Math.min(pct,1));
  return `<svg width="150" height="150"><circle cx="75" cy="75" r="${r}" stroke="var(--card2)" stroke-width="13" fill="none"/>
  <circle cx="75" cy="75" r="${r}" stroke="${color}" stroke-width="13" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)"/></svg>`;
}
function viewHome(){
  const t=dayTotals(todayStr()), goals=db.profile;
  const pct=t.kcal/(goals.calGoal||2000);
  const water = (db.water[todayStr()]||0);
  const streak = calcStreak();
  const slots=["Breakfast","Lunch","Snacks","Dinner"].map(s=>{
    const ms=mealsOn(todayStr()).filter(m=>m.slot===s);
    return `<div class="card" style="padding:14px 16px"><div class="row between"><h2 style="font-size:16px">${s}</h2><span class="small">${ms.length?ms.reduce((a,m)=>a+m.totals.kcal,0)+" kcal":"—"}</span></div>
    ${ms.length? ms.map(m=>`<div class="meal-item" onclick="viewMeal('${m.id}')">
      ${m.img?`<img class="meal-img" src="${m.img}">`:`<div class="meal-img" style="display:flex;align-items:center;justify-content:center;font-size:22px">🍽</div>`}
      <div style="flex:1;min-width:0"><b style="font-size:14px">${esc(m.title)}</b> <span class="est-tag">ESTIMATE</span><div class="small">${m.time} · ${m.items.length} item${m.items.length>1?"s":""} · ${m.totals.kcal} kcal · P ${m.totals.p}g</div></div>
    </div>`).join("") : `<div class="small" style="padding:8px 0 2px">Nothing logged yet</div>`}</div>`;
  }).join("");
  return `<div class="page">
    <div class="hdr"><div><h1>NutriSnap</h1><div class="date">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</div></div>
      <div class="row"><span class="tag">🔥 ${streak} day streak</span>
      <button class="iconbtn" onclick="toggleTheme()">${state.theme==="dark"?"☀":"☾"}</button></div></div>
    <div class="card" style="text-align:center">
      <div class="ring">${ringSVG(pct, pct>1?"var(--red)":"var(--green)")}
        <div class="center"><div class="big">${t.kcal}</div><div class="small">of ${goals.calGoal||2000} kcal</div></div></div>
      <div class="small">${pct>1?`Over by ${t.kcal-(goals.calGoal||2000)} kcal — that's okay, balance over the week matters. ⭐`:`${(goals.calGoal||2000)-t.kcal} kcal remaining`}</div>
    </div>
    <div class="grid4" style="margin-bottom:14px">
      <div class="macro"><b style="color:var(--blue)">${t.p}g</b><span>Protein /${goals.proteinGoal||120}g</span><div class="pbar" style="width:100%"><div style="width:${Math.min(t.p/(goals.proteinGoal||120)*100,100)}%;background:var(--blue)"></div></div></div>
      <div class="macro"><b style="color:var(--orange)">${t.c}g</b><span>Carbs</span><div class="pbar" style="width:100%"><div style="width:${Math.min(t.c/250*100,100)}%;background:var(--orange)"></div></div></div>
      <div class="macro"><b style="color:var(--red)">${t.f}g</b><span>Fats</span><div class="pbar" style="width:100%"><div style="width:${Math.min(t.f/70*100,100)}%;background:var(--red)"></div></div></div>
      <div class="macro"><b style="color:var(--green-deep)">${t.fib}g</b><span>Fiber</span><div class="pbar" style="width:100%"><div style="width:${Math.min(t.fib/30*100,100)}%;background:var(--green)"></div></div></div>
    </div>

function downscale(dataUrl, cb){
  const img=new Image(); img.onload=()=>{ const cv=document.createElement("canvas");
    const max=900, k=Math.min(1,max/Math.max(img.width,img.height));
    cv.width=img.width*k; cv.height=img.height*k; cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    cb(cv.toDataURL("image/jpeg",.72)); };
  img.src=dataUrl;
}
async function startAnalysis(img, mime){

  // No key / offline: fall back to manual confirmation with suggestions

  render();

async function geminiRecognize(imgDataUrl, key){
  const b64=imgDataUrl.split(",")[1];
  const foodList=FOODS.map(f=>f[0]).join(", ");
  const prompt=`You are a food recognition assistant. Look at this meal photo. Identify every distinct food item and estimate portion size in grams. Reply with ONLY a JSON array, no markdown, like: [{"name":"Chicken breast (cooked)","grams":150}]. Choose names ONLY from this list: ${foodList}. If a food isn't in the list, pick the closest match. Be realistic with portion sizes. If no food is visible, return [].`;
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:"image/jpeg",data:b64}}]}]})});
  if(!res.ok) throw new Error("vision api");
  const data=await res.json();
  const text=data.candidates?.[0]?.content?.parts?.[0]?.text||"[]";
  const arr=JSON.parse(text.replace(/```json|```/g,"").trim());
  return arr.map(x=>{ const match=FOODS.find(f=>f[0].toLowerCase()===String(x.name).toLowerCase())?.[0] || closestFood(x.name);
    return itemNutrients(match, Math.max(10,Math.min(600,+x.grams||100))); }).filter(Boolean);
}
function closestFood(name){
  const n=String(name).toLowerCase(); let best=FOODS[0][0], bs=0;
  for(const f of FOODS){ const words=n.split(/[^a-z]+/).filter(w=>w.length>2); const sc=words.filter(w=>f[0].toLowerCase().includes(w)).length/Math.max(words.length,1); if(sc>bs){bs=sc;best=f[0];} }
  return best;
}

  const days=weekDates(), kcals=days.map(d=>dayTotals(d).kcal), ps=days.map(d=>dayTotals(d).p);
  const maxK=Math.max(...kcals,db.profile.calGoal||2000)*1.15, maxP=Math.max(...ps,db.profile.proteinGoal||120)*1.3;
  const pad=8, bw=(w-pad*2)/7;

  ctx.font="10px -apple-system,sans-serif"; ctx.fillStyle=css.getPropertyValue("--muted");
  days.forEach((d,i)=>{ const x=pad+i*bw+bw*0.15, bh=(kcals[i]/maxK)*(h-40);
    ctx.fillStyle="rgba(52,199,89,.35)"; roundRect(ctx,x,h-24-bh,bw*0.5,Math.max(bh,2),5); ctx.fill();
    ctx.fillStyle=css.getPropertyValue("--muted"); ctx.textAlign="center";
    ctx.fillText(new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"narrow"}), x+bw*0.25, h-8); });
  ctx.strokeStyle=css.getPropertyValue("--blue"); ctx.lineWidth=2.5; ctx.beginPath();
  ps.forEach((p,i)=>{ const x=pad+i*bw+bw*0.4, y=h-24-(p/maxP)*(h-40); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

async function geminiChat(q,key){
  const t=dayTotals(todayStr());
  const ctx=`User's nutrition context (local estimates): Today ${t.kcal} kcal, P ${t.p}g, C ${t.c}g, F ${t.f}g, fiber ${t.fib}g. Goals: ${db.profile.calGoal} kcal, ${db.profile.proteinGoal}g protein. Meals today: ${mealsOn(todayStr()).map(m=>m.title+" ("+m.slot+", ~"+m.totals.kcal+" kcal, P "+m.totals.p+"g)").join("; ")||"none"}. Food db per 100g available for reference: ${FOODS.slice(0,40).map(f=>f[0]+" "+f[1]+"kcal P"+f[2]).join(", ")}... Be concise (under 120 words), friendly, and always note values are estimates. Never recommend extreme dieting.`;
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:ctx+"

User question: "+q}]}]})});
  if(!res.ok) throw new Error();
  return (await res.json()).candidates?.[0]?.content?.parts?.[0]?.text || localAnswer(q);
}
function localAnswer(q){
  const s=q.toLowerCase(), t=dayTotals(todayStr());
  if(/protein.*today|today.*protein|protein did/.test(s)) return `Today you've had ≈${t.p}g protein of your ${db.profile.proteinGoal||120}g goal — ${Math.max(0,(db.profile.proteinGoal||120)-t.p)}g to go. ${t.p>= (db.profile.proteinGoal||120)*.8 ? "Great job! 💪" : "Try eggs, Greek yogurt, chicken, or lentils to close the gap."}`;
  if(/most protein|which meal/.test(s)){ const ms=mealsOn(todayStr()); if(!ms.length) return "No meals logged today yet — scan something!";
    const top=ms.slice().sort((a,b)=>b.totals.p-a.totals.p)[0];
    return `Your highest-protein meal today is "${top.title}" (${top.slot}) with ≈${top.totals.p}g protein and ${top.totals.kcal} kcal.`; }
  if(/balanced meal|suggest.*meal|what should i eat/.test(s)) return "Here's a balanced plate idea:
• Grilled chicken or tofu (palm-sized) — protein
• Brown rice or quinoa (fist-sized) — carbs
• Big handful of broccoli/spinach — fiber & micronutrients
• A thumb of olive oil or avocado — healthy fats

≈550–650 kcal, ~40g protein. (Estimates vary with portions.)";
  if(/nutrient|nutrition.* in /.test(s)){ const hit=FOODS.find(f=>s.includes(f[0].split(" (")[0].toLowerCase()));
    if(hit){ const f=F[hit[0]]; return `${hit[0]} per 100 g:
≈${f.kcal} kcal · ${f.p}g protein · ${f.c}g carbs · ${f.f}g fat · ${f.fib}g fiber.

${healthyAlt(hit[0])}`; }
    return "Tell me a specific food (e.g. 'nutrients in salmon') and I'll break it down."; }
  if(/week|summary/.test(s)){ const ds=weekDates(), ks=ds.map(d=>dayTotals(d).kcal), ps=ds.map(d=>dayTotals(d).p);
    const avgK=Math.round(ks.reduce((a,b)=>a+b,0)/7), avgP=+(ps.reduce((a,b)=>a+b,0)/7).toFixed(1);
    const best=ds.slice().sort((a,b)=>dayTotals(b).kcal-dayTotals(a).kcal)[0];
    return `Weekly summary (7 days, estimates):
• Avg ${avgK} kcal/day · ${avgP}g protein/day
• Best day: ${new Date(best+"T12:00").toLocaleDateString(undefined,{weekday:"long"})} (${dayTotals(best).kcal} kcal)
• Meals logged: ${ds.reduce((a,d)=>a+mealsOn(d).length,0)}

Consistency beats perfection — keep the streak going! 🔥`; }
  if(/water/.test(s)) return `You've had ${db.water[todayStr()]||0} of ${db.profile.waterGoal||8} glasses today. Tap a glass on Home to log more. 💧`;
  if(/streak/.test(s)) return `You're on a ${calcStreak()}-day logging streak! ${calcStreak()>=7?"Impressive consistency. 🏆":"Log a meal today to keep it alive."}`;
  if(/calorie|kcal/.test(s)) return `Today: ≈${t.kcal} kcal of your ${db.profile.calGoal||2000} kcal goal — ${Math.max(0,(db.profile.calGoal||2000)-t.kcal)} remaining. Remember: day-to-day wiggles are normal; the weekly average is what matters.`;
  if(/hello|hi|hey/.test(s)) return "Hey! 👋 I can check your protein, summarize your week, suggest balanced meals, or break down nutrients in a food. What would you like to know?";
  return "I can help with:
• Protein eaten today
• Highest-protein meal
• Balanced meal ideas
• Nutrients in a specific food
• Weekly summary
• Water & streak status

Tip: add a Gemini API key in Profile for a full conversational AI.";
}

/* ---------- PROFILE ---------- */
function viewProfile(){
  const p=db.profile, s=db.settings;
  return `<div class="page"><div class="hdr"><div><h1>Profile</h1><div class="date">Goals & settings</div></div></div>
  <div class="card">
    <div class="grid2">
      <div class="field"><label>Age</label><input type="number" id="p-age" value="${p.age}" min="10" max="100"></div>
      <div class="field"><label>Height (cm)</label><input type="number" id="p-height" value="${p.height}" min="120" max="230"></div>
    </div>
    <div class="field"><label>Activity level</label><select id="p-activity">
      ${[["sedentary","Sedentary (desk job)"],["light","Light (1–2 workouts/week)"],["moderate","Moderate (3–4 workouts/week)"],["active","Active (5–6 workouts/week)"]].map(([v,l])=>`<option value="${v}" ${p.activity===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label>Food preference</label><select id="p-pref">
      ${["nonveg","vegetarian","vegan"].map(v=>`<option ${p.pref===v?"selected":""}>${v}</option>`).join("")}</select></div>
    <div class="field"><label>Goal</label><select id="p-goal">
      ${["lose gently","maintain","gain muscle"].map(v=>`<option ${p.goal===v?"selected":""}>${v}</option>`).join("")}</select></div>
  </div>
  <div class="card"><div class="row between" style="margin-bottom:12px"><h2 style="font-size:16px">Daily targets</h2><button class="chip" onclick="autoGoals()">⚡ Auto-calculate</button></div>
    <div class="grid2">
      <div class="field"><label>Calories (kcal)</label><input type="number" id="g-cal" value="${p.calGoal}"></div>
      <div class="field"><label>Protein (g)</label><input type="number" id="g-prot" value="${p.proteinGoal}"></div>
    </div>
    <div class="field"><label>Water goal (glasses)</label><input type="number" id="g-water" value="${p.waterGoal}"></div>
    <div class="notice">These are flexible targets, not rules. All food values in NutriSnap are estimates — adjust freely and listen to your body.</div>
    <button class="btn btn-green" onclick="saveProfile()">Save profile</button>
  </div>
  <div class="card"><h2 style="font-size:16px;margin-bottom:8px">🔑 AI Vision API (Gemini)</h2>
    <p class="small" style="margin-bottom:10px;line-height:1.5">For real AI photo recognition, paste a Gemini API key. It is stored only on your device (localStorage) and sent directly to Google — never to any other server. For a production app, route calls through your own backend so keys stay server-side.</p>
    <div class="field"><label>Gemini API key (optional)</label><input type="password" id="s-key" value="${esc(s.geminiKey||"")}" placeholder="AIza…"></div>
    <button class="btn btn-soft" onclick="saveKey()">Save key</button>
    <p class="small" style="margin-top:8px">Without a key, the app falls back to manual confirmation with suggested items. Get a free key at aistudio.google.com.</p>
  </div>
  <div class="card"><h2 style="font-size:16px;margin-bottom:8px">📲 Install on iPhone</h2>
    <p class="small" style="line-height:1.6">1. Host this file over HTTPS (GitHub Pages, Netlify, Vercel — all free).<br>2. Open it in Safari → Share → "Add to Home Screen".<br>Camera access requires HTTPS, which is why hosting matters.</p></div>
  <div class="card"><div class="row between"><div><h2 style="font-size:16px">Dark mode</h2><div class="small">Easier on evening eyes</div></div>
    <button class="switch ${state.theme==="dark"?"on":""}" onclick="toggleTheme()"></button></div></div>
  <div class="card"><h2 style="font-size:16px;margin-bottom:10px">Data</h2>
    <div class="row" style="gap:10px"><button class="btn btn-soft" onclick="exportData()">Export JSON</button>
    <button class="btn btn-danger" onclick="if(confirm('Delete ALL data?')){localStorage.removeItem(LS_KEY);location.reload()}">Erase all</button></div>
    <p class="small" style="margin-top:8px">${db.meals.length} meals · stored locally in your browser (localStorage — a database for your device).</p></div>
  </div>`;
}
function autoGoals(){
  const age=+$("#p-age").value||28, h=+$("#p-height").value||175, act=$("#p-activity").value, goal=$("#p-goal").value, pref=$("#p-pref").value;
  const bmr=10*70+6.25*h-5*age+5; // assumes ~70 kg — user can adjust
  const mult={sedentary:1.35,light:1.5,moderate:1.65,active:1.85}[act]||1.6;
  let cal=Math.round(bmr*mult/10)*10;
  if(goal==="lose gently") cal-=250; if(goal==="gain muscle") cal+=250;
  $("#g-cal").value=cal; $("#g-prot").value= goal==="gain muscle"?140: Math.round(1.6*70);
  toast("Targets estimated — tweak them freely ⚡");
}
function saveProfile(){
  db.profile={ age:+$("#p-age").value||28, height:+$("#p-height").value||175, activity:$("#p-activity").value,
    pref:$("#p-pref").value, goal:$("#p-goal").value, calGoal:+$("#g-cal").value||2000,
    proteinGoal:+$("#g-prot").value||120, waterGoal:+$("#g-water").value||8 };
  save(); toast("Profile saved ✓");
}
function saveKey(){ db.settings.geminiKey=$("#s-key").value.trim(); save(); toast(db.settings.geminiKey?"Key saved — AI scan enabled!":"Key removed"); }
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="nutrisnap-export.json"; a.click();
}

/* ---------- BOOT ---------- */
render();
</script>
